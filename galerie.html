<style>
/* ── CARROUSEL GALERIE PRINCIPAL ── */
.galerie-hero {
  position: relative;
  height: 100vh;
  overflow: hidden;
  background: var(--noir);
}
.galerie-track {
  display: flex;
  height: 100%;
  transition: transform .8s cubic-bezier(.4,0,.2,1);
}
.galerie-slide {
  flex: 0 0 100%;
  height: 100%;
  position: relative;
  cursor: pointer;
  overflow: hidden;
}
.galerie-slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .6s ease;
  filter: brightness(.75);
}
.galerie-slide:hover img { transform: scale(1.03); }
.galerie-slide-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-end;
  padding: 0 0 40px;
  pointer-events: none;
}
.galerie-slide-bandeau {
  background: rgba(0,0,0,.52);
  padding: 20px 24px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 100%;
}
.galerie-slide-title {
  font-family: 'Abril Fatface', serif;
  font-size: clamp(2rem, 6vw, 4.5rem);
  font-weight: 400;
  color: white;
  text-align: center;
  letter-spacing: 2px;
  margin-bottom: 16px;
  text-transform: uppercase;
  line-height: 1.1;
}
.galerie-slide-cta {
  font-family: 'Arimo', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: white;
  border: 1px solid rgba(255,255,255,.6);
  padding: 10px 24px;
  pointer-events: auto;
  cursor: pointer;
  transition: all .2s;
  background: rgba(0,0,0,.2);
}
.galerie-slide-cta:hover { background: white; color: var(--noir); }

/* Flèches */
.galerie-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.3);
  color: white;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  cursor: pointer;
  z-index: 10;
  transition: all .2s;
  backdrop-filter: blur(4px);
}
.galerie-arrow:hover { background: rgba(255,255,255,.3); }
.galerie-arrow.left { left: 24px; }
.galerie-arrow.right { right: 24px; }

/* Dots */
.galerie-dots {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 10;
}
.galerie-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,.4);
  cursor: pointer;
  transition: all .3s;
  border: none;
  padding: 0;
}
.galerie-dot.active {
  background: white;
  width: 24px;
  border-radius: 3px;
}

/* Loader */
.galerie-loader {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,.5);
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ── MODALE ── */
.galerie-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: flex-start;
  justify-content: center;
  overflow-y: auto;
}
.galerie-modal.open { display: flex; }
.galerie-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  z-index: -1;
  backdrop-filter: blur(4px);
}
.galerie-modal-inner {
  background: var(--bg);
  width: 100%;
  max-width: 900px;
  min-height: 100vh;
  position: relative;
  animation: modalIn .35s ease;
}
@keyframes modalIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

.modal-close {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: flex-end;
  padding: 16px 20px;
  background: var(--bg);
}
.modal-close-btn {
  background: none;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  color: var(--noir);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: background .2s;
}
.modal-close-btn:hover { background: rgba(0,0,0,.08); }

/* Cover modale */
.modal-cover {
  width: 100%;
  height: 50vh;
  object-fit: cover;
  display: block;
  margin-top: -52px;
}

/* Contenu modale */
.modal-content { padding: 32px 28px 60px; }
.modal-title {
  font-family: 'Abril Fatface', serif;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 400;
  color: var(--noir);
  margin-bottom: 12px;
  line-height: 1.1;
  text-align: center;
}
.modal-description {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.85;
  margin-bottom: 32px;
  text-align: center;
}

/* 2 photos fixes */
.modal-duo {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
  margin-bottom: 40px;
}
.modal-duo img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  display: block;
}

/* Articles */
.modal-articles-title { font-family:'Abril Fatface',serif; font-size:1.5rem; font-weight:400; color:var(--noir); margin-bottom:16px; }
.modal-section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--rose);
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(0,0,0,.07);
}
.modal-articles-wrap-inner {
  position: relative;
}
.modal-articles-track {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 0;
}
.modal-articles-track::-webkit-scrollbar { display: none; }
.modal-article-card {
  flex: 0 0 160px;
  cursor: pointer;
  background: var(--white);
  position: relative;
}
.modal-article-img {
  aspect-ratio: 3/4;
  background: var(--bg);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-article-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform .4s ease;
}
.modal-article-card:hover .modal-article-img img { transform: scale(1.04); }
.modal-article-heart {
  position: absolute;
  top: 8px;
  right: 8px;
  background: white;
  border: none;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
  box-shadow: 0 2px 6px rgba(0,0,0,.12);
  color: var(--muted);
  transition: all .2s;
}
.modal-article-heart:hover, .modal-article-heart.active { color: var(--rose); }
.modal-article-name {
  padding: 8px 6px 4px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--noir);
}
.modal-article-price {
  padding: 0 6px 10px;
  font-size: 11px;
  color: var(--muted);
}
.modal-articles-arrow {
  position: absolute;
  top: 40%;
  transform: translateY(-50%);
  background: var(--white);
  border: 1px solid rgba(0,0,0,.1);
  border-radius: 100px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  font-size: 1.1rem;
  color: var(--noir);
  transition: all .2s;
}
.modal-articles-arrow:hover { background: var(--noir); color: white; }
.modal-articles-arrow.left { left: -12px; }
.modal-articles-arrow.right { right: -12px; }

/* Grille photos */
.modal-photos-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 3px;
}
@media(min-width:860px){
  .modal-photos-grid { grid-template-columns: repeat(3, 1fr); }
}
.modal-photo-item {
  aspect-ratio: 1/1;
  overflow: hidden;
  cursor: pointer;
}
.modal-photo-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .4s ease;
}
.modal-photo-item:hover img { transform: scale(1.04); }
.modal-photo-item.centered {
  grid-column: 1 / -1;
  max-width: 50%;
  margin: 0 auto;
  width: 100%;
}
@media(min-width:860px){
  .modal-photo-item.centered { max-width: 33.33%; }
}

/* Lightbox */
.galerie-lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.95);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
}
.galerie-lightbox.open { display: flex; }
.lightbox-img {
  max-width: 90vw;
  max-height: 90vh;
  object-fit: contain;
  display: block;
}
.lightbox-close {
  position: absolute;
  top: 20px;
  right: 20px;
  background: none;
  border: none;
  color: white;
  font-size: 2rem;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
}

@media(max-width:680px){
  .modal-content { padding: 24px 20px 48px; }
  .galerie-arrow { width: 38px; height: 38px; font-size: 1.1rem; }
}
</style>

<script>
function toggleSidebar(){var sb=document.getElementById('sidebar'),ov=document.getElementById('sb-overlay'),isOpen=sb.classList.contains('open');sb.classList.toggle('open');ov.classList.toggle('on');document.body.classList.toggle('sb-open',!isOpen);}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sb-overlay').classList.remove('on');document.body.classList.remove('sb-open');}
function toggleCats(btn){var wrap=btn.closest('.sb-axis-wrap');var cats=wrap?wrap.nextElementSibling:btn.nextElementSibling;if(cats)cats.classList.toggle('open');btn.classList.toggle('open');}
if(window.innerWidth>860){document.getElementById('sidebar').classList.add('open');document.getElementById('main')&&(document.getElementById('main').style.marginLeft='var(--sb-w)');}
function updateBadge(){var favs=JSON.parse(localStorage.getItem('reunis_favoris')||'[]');document.querySelectorAll('.heart-badge').forEach(function(b){b.textContent=favs.length;b.classList.toggle('visible',favs.length>0);});}
updateBadge();

var HEART_SVG='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

var evenements = [];
var galerieIndex = 0;
var autoplay;

// ── Charger la galerie ──
fetch('/api/galerie')
  .then(function(r){ return r.json(); })
  .then(function(data){
    evenements = data;
    buildCarrousel();
  })
  .catch(function(){
    document.getElementById('galerie-track').innerHTML = '<div class="galerie-loader">Erreur de chargement</div>';
  });

function buildCarrousel(){
  var track = document.getElementById('galerie-track');
  var dots = document.getElementById('galerie-dots');
  track.innerHTML = '';
  dots.innerHTML = '';

  if(!evenements.length){
    track.innerHTML = '<div class="galerie-loader" style="color:rgba(255,255,255,.4);">Aucune réalisation publiée pour le moment.</div>';
    return;
  }

  evenements.forEach(function(ev, i){
    var slide = document.createElement('div');
    slide.className = 'galerie-slide';
    slide.innerHTML = '<img src="' + ev.cover + '" alt="' + ev.titre + '" loading="' + (i===0?'eager':'lazy') + '">'
      + '<div class="galerie-slide-overlay">'
      + '<div class="galerie-slide-bandeau">'
      + '<div class="galerie-slide-title">' + ev.titre + '</div>'
      + '<div class="galerie-slide-cta" onclick="openModal(' + i + ')">Découvrir</div>'
      + '</div>'
      + '</div>';
    slide.onclick = function(e){ if(e.target.classList.contains('galerie-slide-cta'))return; openModal(i); };
    track.appendChild(slide);

    var dot = document.createElement('div');
    dot.className = 'galerie-dot' + (i===0?' active':'');
    dot.onclick = function(){ galerieGoTo(i); };
    dots.appendChild(dot);
  });

  startAutoplay();
}

function galerieGoTo(n){
  galerieIndex = (n + evenements.length) % evenements.length;
  document.getElementById('galerie-track').style.transform = 'translateX(-' + galerieIndex*100 + '%)';
  document.querySelectorAll('.galerie-dot').forEach(function(d,i){ d.classList.toggle('active', i===galerieIndex); });
  clearInterval(autoplay); startAutoplay();
}
function galerieSlide(dir){ galerieGoTo(galerieIndex + dir); }
function startAutoplay(){ autoplay = setInterval(function(){ galerieGoTo(galerieIndex+1); }, 5000); }

// ── Modale ──
function openModal(idx){
  clearInterval(autoplay);
  var ev = evenements[idx];
  if(!ev) return;

  document.getElementById('modal-cover').src = ev.cover;
  document.getElementById('modal-cover').alt = ev.titre;
  document.getElementById('modal-title').textContent = ev.titre;
  document.getElementById('modal-description').textContent = ev.description || '';

  // 2 photos fixes
  var duo = document.getElementById('modal-duo');
  duo.innerHTML = '';
  var duoPhotos = ev.photos.slice(0,2);
  duoPhotos.forEach(function(url){
    var img = document.createElement('img');
    img.src = url; img.alt = ev.titre;
    img.onclick = function(){ openLightbox(url); };
    duo.appendChild(img);
  });
  duo.style.display = duoPhotos.length >= 2 ? 'grid' : 'none';

  // Articles
  var grid = document.getElementById('modal-articles-grid');
  var wrap = document.getElementById('modal-articles-wrap');
  grid.innerHTML = '';
  if(ev.articles && ev.articles.length){
    wrap.style.display = 'block';
    var favIds = JSON.parse(localStorage.getItem('reunis_favoris')||'[]').map(function(f){return f.id||f.name;});
    ev.articles.forEach(function(a){
      var isFav = favIds.indexOf(a.id)>=0 || favIds.indexOf(a.nom)>=0;
      var prix = a.prix ? parseFloat(a.prix).toFixed(2)+'€' : 'Sur devis';
      var card = document.createElement('div');
      card.className = 'modal-article-card';
      card.innerHTML = '<div class="modal-article-img">'
        + (a.photo ? '<img src="'+a.photo+'" alt="'+a.nom+'" loading="lazy">' : '<div style="font-size:2rem;color:#ddd;">✦</div>')
        + '</div>'
        + '<button class="modal-article-heart'+(isFav?' active':'')+'" aria-label="Favori" onclick="event.stopPropagation();toggleHeart(this,'+JSON.stringify(a)+')">'+HEART_SVG+'</button>'
        + '<div class="modal-article-name">'+a.nom+'</div>'
        + '<div class="modal-article-price">'+prix+'</div>';
      card.onclick = function(){
        localStorage.setItem('reunis_article_courant', JSON.stringify(a));
        window.location.href = 'article.html';
      };
      grid.appendChild(card);
    });
  } else {
    wrap.style.display = 'none';
  }

  // Toutes les photos (à partir de la 3e)
  var photosTrack = document.getElementById('modal-photos-track');
  var photosWrap = document.getElementById('modal-photos-wrap');
  photosTrack.innerHTML = '';
  var allPhotos = ev.photos.slice(2);
  if(allPhotos.length){
    photosWrap.style.display = 'block';
    allPhotos.forEach(function(url){
      var slide = document.createElement('div');
      slide.className = 'modal-photo-slide';
      slide.innerHTML = '<img src="'+url+'" alt="'+ev.titre+'" loading="lazy">';
      slide.onclick = function(){ openLightbox(url); };
      photosTrack.appendChild(slide);
    });
  } else {
    photosWrap.style.display = 'none';
  }

  document.getElementById('galerie-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('galerie-modal').classList.remove('open');
  document.body.style.overflow = '';
  startAutoplay();
}

function articlesScroll(dir){
  var track = document.getElementById('modal-articles-grid');
  track.scrollBy({ left: dir * 300, behavior: 'smooth' });
}

// ── Lightbox ──
function openLightbox(url){
  document.getElementById('lightbox-img').src = url;
  document.getElementById('galerie-lightbox').classList.add('open');
}
function closeLightbox(){
  document.getElementById('galerie-lightbox').classList.remove('open');
}

// ── Favoris ──
function toggleHeart(btn, a){
  btn.classList.toggle('active');
  var favs = JSON.parse(localStorage.getItem('reunis_favoris')||'[]');
  if(btn.classList.contains('active')){
    if(!favs.find(function(f){return f.id===a.id||f.name===a.nom;})){
      favs.push({id:a.id||'',name:a.nom,qty:1,prix:parseFloat(a.prix)||0,photo:a.photo||'',categorie:'',personnalisable:'Non',perso:null});
    }
  } else {
    favs = favs.filter(function(f){return f.id!==a.id&&f.name!==a.nom;});
  }
  localStorage.setItem('reunis_favoris', JSON.stringify(favs));
  updateBadge();
}

// Fermer modale avec Escape
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    if(document.getElementById('galerie-lightbox').classList.contains('open')) closeLightbox();
    else if(document.getElementById('galerie-modal').classList.contains('open')) closeModal();
  }
});
</script>
</body>
